<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MEMORA — slide 03</title>
<link rel="stylesheet" href="styles.css">
<style>
  .title {
    position: absolute;
    top: 148px;
    left: 64px;
    font-size: 185px;
    z-index: 22;
  }
  .title .sec { color: var(--accent); }

  .steps {
    position: absolute;
    left: 64px;
    bottom: 160px;
    width: 430px;
    z-index: 25;
  }
  .step {
    display: flex;
    gap: 24px;
    align-items: baseline;
    padding: 26px 0;
    border-top: 3px solid var(--ink);
  }
  .step:last-child { border-bottom: 3px solid var(--ink); }
  .step .num {
    font-family: 'Anton', sans-serif;
    font-size: 44px;
    color: var(--accent);
    min-width: 64px;
  }
  .step .txt {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
  }

  /* --------- mockup pile de flashcards --------- */
  .deck {
    position: absolute;
    right: 48px;
    bottom: 132px;
    width: 430px;
    height: 455px;
    z-index: 20;
  }
  .card {
    position: absolute;
    inset: 0;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 18px 0 -6px rgba(20,20,18,.12);
  }
  .card.c3 { transform: rotate(7deg) translate(18px, 6px); background: #E9E6DE; }
  .card.c2 { transform: rotate(-4deg) translate(-10px, 2px); background: #fff; }
  .card.c1 {
    transform: rotate(1.5deg);
    display: flex;
    flex-direction: column;
    padding: 44px;
  }
  .card.c1 .cardtag {
    align-self: flex-start;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 26px;
  }
  .card.c1 .q {
    font-family: 'Anton', sans-serif;
    font-size: 45px;
    line-height: 1.08;
    text-transform: uppercase;
    flex: 1;
  }
  .card.c1 .actions {
    display: flex;
    gap: 18px;
  }
  .card.c1 .btn {
    flex: 1;
    text-align: center;
    padding: 20px 0;
    border-radius: 18px;
    font-size: 26px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    border: 3px solid var(--ink);
  }
  .card.c1 .btn.ko { background: #fff; }
  .card.c1 .btn.ok { background: var(--ink); color: #fff; }

  .sticker {
    position: absolute;
    right: -12px;
    bottom: -30px;
    z-index: 26;
    transform: rotate(-4deg);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="header">
    <div>Memora&reg;</div>
    <div>&copy;2026</div>
  </div>

  <h1 class="title display">
    Tes fiches<br>
    en <span class="sec">30 sec.</span>
  </h1>

  <div class="steps">
    <div class="step"><div class="num">01</div><div class="txt">Photographie ton cours</div></div>
    <div class="step"><div class="num">02</div><div class="txt">L'IA g&eacute;n&egrave;re tes flashcards</div></div>
    <div class="step"><div class="num">03</div><div class="txt">R&eacute;vise 5 min par jour, au bon moment</div></div>
  </div>

  <div class="deck">
    <div class="card c3"></div>
    <div class="card c2"></div>
    <div class="card c1">
      <div class="cardtag">Biologie &mdash; fiche 12</div>
      <div class="q">La photosynth&egrave;se, c'est quoi&nbsp;?</div>
      <div class="actions">
        <div class="btn ko">&Agrave; revoir</div>
        <div class="btn ok">Acquis</div>
      </div>
    </div>
    <div class="sticker"><span class="pill accent">G&eacute;n&eacute;r&eacute; par l'IA</span></div>
  </div>

  <div class="footer">
    <div class="pagination">03<span>/</span>04</div>
    <div style="font-weight:800; text-transform:uppercase; letter-spacing:.12em;">Z&eacute;ro effort, vrai r&eacute;sultat</div>
  </div>
</div>
</body>
</html>
