<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme : coeff-bac 02</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  .zone {
    position: absolute; left: 168px; right: 74px; top: 186px; bottom: 250px;
    z-index: 30; display: flex; flex-direction: column;
  }
  .tete { display: flex; align-items: flex-start; gap: 34px; }
  .numero {
    flex: none; font-size: 76px; font-weight: 900; line-height: 1;
    color: var(--rouge); padding: 6px 26px 14px;
    border: 6px solid var(--rouge);
    border-radius: 58% 42% 54% 46% / 48% 56% 44% 52%;
    transform: rotate(-2deg);
  }
  .title { font-size: 70px; line-height: 1.04; padding-top: 4px; }
  .corps { margin-top: 36px; font-size: 42px; line-height: 1.38; font-weight: 700; color: var(--eel); }
  .note  { align-self: flex-end; text-align: right; margin-top: 10px; }

  .tableau-score {
    margin-top: auto;
    background: rgba(255,253,248,.96);
    border: 4px solid rgba(50,45,39,.12);
    border-bottom-width: 10px;
    border-radius: 28px;
    padding: 26px 34px 28px;
    box-shadow: 0 18px 34px rgba(50,45,39,.10);
  }
  .ligne-score {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 2px dashed rgba(50,45,39,.15);
    font-size: 32px; font-weight: 800; color: var(--eel);
  }
  .ligne-score:last-child { border-bottom: none; }
  .badge-coeff {
    padding: 6px 18px; border-radius: 12px; font-weight: 900; font-size: 28px;
    background: #FFD84D; color: #5C4B00;
  }
  .badge-total {
    padding: 8px 22px; border-radius: 14px; font-weight: 900; font-size: 32px;
    background: var(--fox); color: var(--on-accent);
  }

  .sign { position: absolute; left: 168px; bottom: 96px; z-index: 35; }
</style>
</head>
<body>
<div class="canvas cahier t-ambre">

  <div class="zone">

    <div class="tete">
      <div class="numero">1</div>
      <h1 class="title display">Le vrai calcul&nbsp;:<br>Coeff 10</h1>
    </div>

    <p class="corps">Le baccalaur&eacute;at compte 100 coefficients au total. Le fran&ccedil;ais en repr&eacute;sente <span class="hl j">exactement 10&nbsp;%</span>.</p>

    <div class="note manuscrit penche rouge">ce n'est pas une petite &eacute;preuve</div>

    <div class="tableau-score">
      <div class="ligne-score">
        <span>&Eacute;preuve &eacute;crite (4h)</span>
        <span class="badge-coeff">Coeff 5</span>
      </div>
      <div class="ligne-score">
        <span>&Eacute;preuve orale (20 min)</span>
        <span class="badge-coeff">Coeff 5</span>
      </div>
      <div class="ligne-score">
        <span><b>Total fran&ccedil;ais</b></span>
        <span class="badge-total">Coeff 10</span>
      </div>
    </div>

  </div>

  <div class="sign">
    <div class="foxbadge"></div>
    <div>
      <div class="url">euphemisme.fr</div>
      <div class="sub">Le bac de fran&ccedil;ais en 5&nbsp;min par jour &middot; <b>gratuit</b></div>
    </div>
  </div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
