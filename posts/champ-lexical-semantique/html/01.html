<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme : champ-lexical-semantique 01</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  .title {
    position: absolute; top: 240px; left: 168px; right: 66px;
    font-size: 104px; line-height: 1.04; z-index: 25;
  }
  .accroche {
    position: absolute; left: 168px; top: 790px; width: 800px; z-index: 30;
    font-size: 44px; line-height: 1.34; font-weight: 800; color: var(--eel);
  }
  .accroche b { font-weight: 900; }
  .compteur {
    position: absolute; left: 168px; top: 1010px; z-index: 30;
    display: flex; gap: 16px; align-items: center;
  }
  .compteur .repere {
    width: 68px; height: 68px; border-radius: 18px;
    border: 4px solid rgba(50,45,39,.20);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; color: var(--wolf);
    background: var(--cream-hi);
  }
  .compteur .repere.on {
    border-color: var(--fox-dark); background: var(--fox);
    color: var(--on-accent); box-shadow: 0 8px 0 var(--fox-dark);
  }
  .note { position: absolute; left: 174px; top: 1140px; z-index: 34; }
</style>
</head>
<body>
<div class="canvas cahier t-corail">

  <h1 class="title display">
    Champ lexical<br>
    ou champ<br>
    <span class="hl r">s&eacute;mantique</span>&nbsp;?
  </h1>

  <p class="accroche">La faute de vocabulaire qui <b>&eacute;nerve tous les correcteurs</b> d&egrave;s la premi&egrave;re page.</p>

  <div class="compteur">
    <div class="repere on">1</div>
    <div class="repere">2</div>
    <div class="repere">3</div>
    <div class="repere">4</div>
    <div class="repere">5</div>
  </div>

  <div class="note manuscrit penche rouge">le point b&ecirc;tement perdu en commentaire</div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
