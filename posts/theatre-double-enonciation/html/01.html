<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme : theatre-double-enonciation 01</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  .title {
    position: absolute; top: 240px; left: 168px; right: 66px;
    font-size: 104px; line-height: 1.04; z-index: 25;
  }
  .accroche {
    position: absolute; left: 168px; top: 790px; width: 800px; z-index: 30;
    font-size: 44px; line-height: 1.34; font-weight: 800; color: var(--eel);
  }
  .accroche b { font-weight: 900; }
  .compteur {
    position: absolute; left: 168px; top: 1010px; z-index: 30;
    display: flex; gap: 16px; align-items: center;
  }
  .compteur .projo {
    width: 68px; height: 68px; border-radius: 18px;
    border: 4px solid rgba(50,45,39,.20);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: var(--wolf);
    background: var(--cream-hi);
  }
  .compteur .projo.on {
    border-color: var(--fox-dark); background: var(--fox);
    color: var(--on-accent); box-shadow: 0 8px 0 var(--fox-dark);
  }
  .note { position: absolute; left: 174px; top: 1140px; z-index: 34; }
</style>
</head>
<body>
<div class="canvas cahier t-pervenche">

  <h1 class="title display">
    Qui parle &agrave;<br>
    qui au<br>
    <span class="hl b">th&eacute;&acirc;tre</span>&nbsp;?
  </h1>

  <p class="accroche">N'oublie <b>jamais la salle</b>&nbsp;: le r&eacute;flexe qui transforme toute ton analyse de sc&egrave;ne.</p>

  <div class="compteur">
    <div class="projo on">1</div>
    <div class="projo">2</div>
    <div class="projo">3</div>
    <div class="projo">4</div>
    <div class="projo">5</div>
  </div>

  <div class="note manuscrit penche rouge">le principe cl&eacute; de la double &eacute;nonciation</div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
