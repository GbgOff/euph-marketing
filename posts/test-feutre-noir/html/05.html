<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme : test-feutre-noir 05</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  .zone {
    position: absolute; left: 168px; right: 74px; top: 186px; bottom: 250px;
    z-index: 30; display: flex; flex-direction: column;
  }
  .tete { display: flex; align-items: flex-start; gap: 34px; }
  .numero {
    flex: none; font-size: 76px; font-weight: 900; line-height: 1;
    color: var(--rouge); padding: 6px 26px 14px;
    border: 6px solid var(--rouge);
    border-radius: 58% 42% 54% 46% / 48% 56% 44% 52%;
    transform: rotate(-2deg);
  }
  .title { font-size: 70px; line-height: 1.04; padding-top: 4px; }
  .corps { margin-top: 36px; font-size: 42px; line-height: 1.38; font-weight: 700; color: var(--eel); }
  .note  { align-self: flex-end; text-align: right; margin-top: 10px; }

  .tableau-memo {
    margin-top: auto;
    background: rgba(255,253,248,.96);
    border: 4px solid rgba(50,45,39,.12);
    border-bottom-width: 10px;
    border-radius: 28px;
    padding: 24px 34px 26px;
    box-shadow: 0 18px 34px rgba(50,45,39,.10);
  }
  .ligne-memo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 2px solid rgba(50,45,39,.08);
    font-size: 32px; font-weight: 800; color: var(--eel);
  }
  .ligne-memo:last-child { border-bottom: none; }
  .badge-ko {
    padding: 4px 14px; background: #F8AFB8; color: #8F1D2C;
    border-radius: 8px; font-size: 26px; font-weight: 900;
  }
  .badge-ok {
    padding: 4px 14px; background: #A9E39C; color: #1D5E17;
    border-radius: 8px; font-size: 26px; font-weight: 900;
  }

  .sign { position: absolute; left: 168px; bottom: 96px; z-index: 35; }
</style>
</head>
<body>
<div class="canvas cahier t-corail">

  <div class="zone">

    <div class="tete">
      <div class="numero">4</div>
      <h1 class="title display">Le r&eacute;flexe &agrave; garder<br>toute l'ann&eacute;e</h1>
    </div>

    <p class="corps">Chaque paragraphe d'analyse doit r&eacute;sister au <span class="hl r">test du feutre noir</span>.</p>

    <div class="note manuscrit penche rouge">&agrave; tester au prochain DST</div>

    <div class="tableau-memo">
      <div class="ligne-memo">
        <span>Citation seule &eacute;quivaut &agrave; r&eacute;p&eacute;tition</span>
        <span class="badge-ko">Paraphrase</span>
      </div>
      <div class="ligne-memo">
        <span>Proc&eacute;d&eacute; + Citation + Effet produit</span>
        <span class="badge-ok">Points valid&eacute;s</span>
      </div>
    </div>

  </div>

  <div class="sign">
    <div class="foxbadge"></div>
    <div>
      <div class="url">euphemisme.fr</div>
      <div class="sub">Le bac de fran&ccedil;ais en 5&nbsp;min par jour &middot; <b>gratuit</b></div>
    </div>
  </div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
