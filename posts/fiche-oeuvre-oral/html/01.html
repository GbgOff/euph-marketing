<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme : fiche-oeuvre-oral 01</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  .title {
    position: absolute; top: 240px; left: 168px; right: 66px;
    font-size: 104px; line-height: 1.04; z-index: 25;
  }
  .accroche {
    position: absolute; left: 168px; top: 790px; width: 800px; z-index: 30;
    font-size: 44px; line-height: 1.34; font-weight: 800; color: var(--eel);
  }
  .accroche b { font-weight: 900; }
  .compteur {
    position: absolute; left: 168px; top: 1010px; z-index: 30;
    display: flex; gap: 16px; align-items: center;
  }
  .compteur .case-repere {
    width: 68px; height: 68px; border-radius: 14px;
    border: 4px solid rgba(50,45,39,.20);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: var(--wolf);
    background: var(--cream-hi);
  }
  .compteur .case-repere.on {
    border-color: var(--fox-dark); background: var(--fox);
    color: var(--on-accent); box-shadow: 0 8px 0 var(--fox-dark);
  }
  .note { position: absolute; left: 174px; top: 1140px; z-index: 34; }
</style>
</head>
<body>
<div class="canvas cahier t-ambre">

  <h1 class="title display">
    La fiche<br>
    d'&oelig;uvre en<br>
    <span class="hl o">4 cases</span>
  </h1>

  <p class="accroche">8 minutes d'entretien sur 8 points&nbsp;: <b>une seule feuille pour r&eacute;ussir</b> ton oral.</p>

  <div class="compteur">
    <div class="case-repere on">I</div>
    <div class="case-repere">II</div>
    <div class="case-repere">III</div>
    <div class="case-repere">IV</div>
    <div class="case-repere">&check;</div>
  </div>

  <div class="note manuscrit penche rouge">la matrice strat&eacute;gique pour le jour J</div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
