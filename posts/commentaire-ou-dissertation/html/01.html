<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Euphémisme — commentaire-ou-dissertation 01</title>
<link rel="stylesheet" href="../../../design/euphemisme.css">
<style>
  /* ---- couverture, registre « feuille de choix » ----
     le compteur est une rangée de cases à cocher : trois tests, un verdict. */
  .title {
    position: absolute; top: 262px; left: 168px; right: 66px;
    font-size: 106px; line-height: 1.06; z-index: 25;
  }
  .accroche {
    position: absolute; left: 168px; top: 806px; width: 800px; z-index: 30;
    font-size: 45px; line-height: 1.32; font-weight: 800; color: var(--eel);
  }
  .cases {
    position: absolute; left: 168px; top: 1008px; z-index: 30;
    display: flex; gap: 20px; align-items: center;
  }
  .cases .c {
    width: 82px; height: 82px; border-radius: 16px;
    border: 5px solid rgba(50,45,39,.20);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; color: var(--wolf);
  }
  .cases .c.on {
    border-color: var(--fox-dark); background: var(--fox);
    color: var(--on-accent); box-shadow: 0 8px 0 var(--fox-dark);
  }
  .note { position: absolute; left: 174px; top: 1148px; z-index: 34; }
</style>
</head>
<body>
<div class="canvas cahier t-abricot">

  <h1 class="title display">
    Commentaire<br>
    ou<br>
    <span class="hl j">dissertation</span>&nbsp;?
  </h1>

  <p class="accroche">Le jour J, tu choisis en cinq minutes. Trois tests, et c'est
  r&eacute;gl&eacute;.</p>

  <div class="cases">
    <div class="c on">1</div>
    <div class="c">2</div>
    <div class="c">3</div>
    <div class="c">4</div>
  </div>

  <div class="note manuscrit penche rouge">et pas au feeling</div>

</div>
<script src="../../../design/fox.js"></script>
</body>
</html>
